settings:
  drone:
    speed: 5.0
    startup-speed: 0.2
    startup-seconds: 3
    approach-speed: 0.2
    approach-distance: 100.0
    skull-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzM1YWEzZTJiZjE4NTQ0Zjc1ZTZlMTViMDI2Zjc0N2I1OTllMThmOTZhOWVjNTQ1N2JkNTFhZDhkZjA0YTE2YiJ9fX0="
    delivery-radius: 10.0
    despawn-time-minutes: 10
    despawn-mode: "DELETE"
    max-active-per-sender: 1
    carry-leashed-animals: true
    max-leashed-animals-per-drone: 1
    max-sockets-per-player: 1
    blocked-worlds:
      - "world_nether"
      - "world_the_end"
    particle-types:
      - "ELECTRIC_SPARK"
      # Example RGB dust particle (red, size 1.0):
      # - "DUST:255,0,0:1.0"
    particle-count: 4
    particle-trail-length: 10
    particle-y-offset: 1.0
    flight-sound: "entity.elytra.flying"
    inventory-size: 54
    hologram:
      enabled: true
      offset-y: 1.0
      format: "<gradient:#ffcc33:#ffaa00><bold>ᴘᴀᴋᴇᴛ ғᴜᴇʀ</bold></gradient> <white><receiver> <dark_gray>» <gray>ᴅᴇsᴘᴀᴡɴ: <#ffcc33><minutes>ᴍ <#ffcc33><seconds>s"
    bossbar:
      enabled: true
      format: "<gold>Distanz zur Drone: <white><distance>m</white> <gray>| ETA: <white><eta>s</white></gray>"
      # Available colors: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
      color: "RED"
    collection-animation:
      enabled: true
    launch-animation:
      enabled: true
      seconds: 3
      sound: "entity.firework_rocket.launch"
      sound-volume: 1.0

discord:
  enabled: true
  webhook-url: ""
  username: "Delivery Drone"
  avatar-url: ""
  embed:
    enabled: true
    color: "#00ff00"
    thumbnail:
      enabled: true
      url: ""
    image:
      enabled: false
      url: ""
    footer:
      text: "Advanced Delivery Drones"
      icon-url: ""
  include-items: true
  include-animals: true
  max-items-display: 10
  max-animals-display: 5

