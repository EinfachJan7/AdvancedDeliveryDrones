# Select the language file to use from the languages/ directory (without .yml extension)
# Default is de_DE (German), en_EN, es_Es, fr_FR, ru_RU, zh_CN are also available.
language: de_DE

# Plugin settings
plugin:
  # Check for updates on Modrinth on startup
  check-updates: true
  # Show notifications when config settings are changed in the editor
  config-editor-messages-enabled: true

hooks:
  worldguard: true
  pl3xmap:
    enabled: true
    # The name of the layer shown in the Pl3xMap sidebar
    layer-name: "Delivery Drones"
    marker:
      # If true, the plugin will use an image file from plugins/AdvancedDeliveryDrones/pl3xmap/
      use-custom-icon: false
      # The filename of the image in the pl3xmap folder (e.g. drone.png)
      icon-filename: "drone.png"
      # Fallback color (in HEX) for the drone marker if use-custom-icon is false
      color: "#FFAA00"
      # The size of the circular marker if use-custom-icon is false
      radius: 2.0
      # The tooltip text shown when hovering or clicking the marker
      # Available placeholders: <sender>, <receiver> (shows 'Socket: X' or 'Player: X'), <status>
      tooltip: "Drone (<status>)<br>Sender: <sender><br>Target: <receiver>"
    flight-path:
      # If true, a line will be drawn from the drone's current position to its destination
      enabled: true
      # The color of the flight path line (in HEX)
      color: "#FF0000"
      # The thickness of the flight path line
      weight: 2

database:
  # Storage type for active Drones: "YAML" or "MYSQL"
  # Note: Sockets, Blacklists, and Player Settings are ALWAYS saved in YAML (Fallback is always YAML).
  type: "YAML"
  mysql:
    host: "localhost"
    port: 3306
    database: "deliverydrones"
    username: "root"
    password: ""
    table-prefix: "add_"

settings:
  drone:
    speed: 5.0
    startup-speed: 0.2
    startup-seconds: 3
    approach-speed: 0.2
    approach-distance: 100.0
    skull-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzM1YWEzZTJiZjE4NTQ0Zjc1ZTZlMTViMDI2Zjc0N2I1OTllMThmOTZhOWVjNTQ1N2JkNTFhZDhkZjA0YTE2YiJ9fX0="
    custom-model:
      # Available providers: NONE, NEXO, ORAXEN, ITEMSADDER
      provider: "NONE"
      # Item id for NEXO, ORAXEN, and ITEMSADDER
      item-id: "drone_item"
    glowing-enabled: true
    delivery-radius: 10.0
    despawn-time-minutes: 10
    despawn-mode: "DELETE"
    max-active-per-sender: 1
    carry-leashed-animals: true
    # When a delivery with animals is aborted (offline, cancel, decline, …):
    # FLY = drone flies back to the send point; TELEPORT = instant return to send point
    animal-return-mode: FLY
    mob-sending:
      enabled: false
      radius: 10.0
      leashable-only: true
      persist-nbt-data: true
      # Blacklisted mob types that cannot be sent via mob drones (entity type names, e.g. WARDEN, ENDER_DRAGON)
      blacklist: []
    # Blacklisted items that cannot be placed into the compose menu (material names, e.g. BEDROCK, BARRIER)
    compose-item-blacklist: []
    max-leashed-animals-per-drone: 1
    max-sockets-per-player: 1
    # Send cooldown settings (in seconds)
    send-cooldown-seconds-player: 0
    send-cooldown-seconds-socket: 0
    # Allow sending drones to yourself
    allow-send-to-self-player: false
    # Allow sending drones to your own sockets
    allow-send-to-self-socket: false
    # TRUE: If the player is gliding (using an elytra), the drone follows them in the air until they land, and then lands there.
    follow-gliding-player: true
    # TRUE: Before landing, follow a receiver who is significantly in the air (e.g. long fall) until grounded, relocate once, then land.
    # Does NOT trigger for normal jumps — see airborne-follow-min-height.
    follow-airborne-player-before-landing: true
    # Minimum blocks above solid ground to count as "in the air" (jumps are typically below this).
    airborne-follow-min-height: 5.0
    # After this many seconds from flight start, airborne follow can no longer begin (elytra is unaffected).
    airborne-follow-max-seconds-after-start: 15
    # Settings for locating landed drones with particles
    locate-particles:
      enabled: true
      particle: "HAPPY_VILLAGER"
    # TRUE: Enable Sockets (delivery stations)
    sockets-enabled: true
    socket-name-validation:
      # If true, ONLY allowed-characters can be used. If false, ANY character EXCEPT prohibited-characters can be used.
      use-allowed-list: false
      allowed-characters: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-"
      prohibited-characters: " !@#$%^&*()+={}[]|\\:;\"'<>,.?/"
    # Container integration (automatically unload to containers like Hoppers/Chests near socket)
    container-integration:
      enabled: true
      # Horizontal search radius from socket (0 = only socket block and block directly below)
      search-radius: 0
      blacklist:
        - "TRAPPED_CHEST"
    # TRUE: Enable player as a target destination
    players-enabled: true
    blocked-worlds: []
    particle-types:
      - "ELECTRIC_SPARK"
      # Example RGB dust particle (red, size 1.0):
      # - "DUST:255,0,0:1.0"
    particle-count: 4
    particle-trail-length: 10
    particle-y-offset: 1.0
    flight-sound: "entity.elytra.flying"
    inventory-size: 54
    hologram:
      enabled: true
      offset-y: 1.0
      format: "<gradient:#ffcc33:#ffaa00><bold>ᴘᴀᴄᴋᴀɢᴇ ғᴏʀ</bold></gradient> <white><receiver> <dark_gray>» <gray>ᴅᴇsᴘᴀᴡɴ: <#ffcc33><minutes>ᴍ <#ffcc33><seconds>s"
      format-socket: "<gradient:#ffcc33:#ffaa00><bold>ᴘᴀᴄᴋᴀɢᴇ ғᴏʀ ꜱᴏᴄᴋᴇᴛ</bold></gradient> <white><socket> <dark_gray>» <gray>ᴅᴇsᴘᴀᴡɴ: <#ffcc33><minutes>ᴍ <#ffcc33><seconds>s"
    bossbar:
      enabled: true
      format: "Distance to drone: <distance>m | ETA: <eta>s"
      format-socket: "Drone to Socket <socket> | ETA: <eta>s"
      # Available colors: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
      color: "RED"
    collection-animation:
      enabled: true
    launch-animation:
      enabled: true
      seconds: 3
      sound: "entity.firework_rocket.launch"
      sound-volume: 1.0

discord:
  enabled: true
  webhook-url: ""
  username: "Delivery Drone"
  avatar-url: ""
  embed:
    enabled: true
    color: "#00ff00"
    thumbnail:
      enabled: true
      url: ""
    image:
      enabled: false
      url: ""
    footer:
      text: "Advanced Delivery Drones"
      icon-url: ""
  include-items: true
  include-animals: true
  max-items-display: 10
  max-animals-display: 5
