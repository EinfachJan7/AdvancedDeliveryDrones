        - "<!italic><gray>  ᴀnɪᴍᴀʟs ᴛᴏ ᴀ ᴘʟᴀʏᴇʀ."
        - "<!italic><gray>└────────────────────┘"
        - "<!italic><yellow>⬥ <italic>ᴄʟɪᴄᴋ ᴛᴏ sᴇʟᴇᴄᴛ</italic>"
    items:
      position: 15
