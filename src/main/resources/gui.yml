# =============================================================================
# ADVANCED DELIVERY DRONES - GUI CONFIGURATION
# =============================================================================
# This file contains all GUI configurations for the drone plugin.
#
# PLAYER_HEAD items support an optional custom skull texture:
#   material: "PLAYER_HEAD"
#   value: "<base64-texture>"   # also accepts head-texture or texture
# =============================================================================

global:
  fill-item:
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
  back-item:
    material: "ARROW"
    name: "<!italic><yellow>⟵ ʙᴀᴄᴋ</yellow>"
    lore:
      - "<!italic><gray>  Back"

# =============================================================================
# COMPOSE HUB - Load items (left) or launch drone (right) before sending
# =============================================================================
compose-hub:
  title: "<!italic><dark_gray>✦ <gold>ᴘʀᴇᴘᴀʀᴇ ᴘᴀᴄᴋᴀɢᴇ</gold> <dark_gray>✦"
  size: 27
  items:
    load-items:
      position: 11
      material: "CHEST"
      name: "<!italic><green><bold>📦 ᴘᴀᴄᴋ ɪᴛᴇᴍs</bold></green>"
      lore:
        - "<!italic><gray>┌────────────────────┐"
        - "<!italic><gray>  ᴏᴘᴇɴs ᴛʜᴇ"
        - "<!italic><gray>  ᴘᴀᴄᴋᴀɢᴇ ɪɴᴠᴇɴᴛᴏʀʏ"
        - "<!italic><gray>└────────────────────┘"
        - "<!italic><green>⬥ <italic>ᴄʟɪᴄᴋ ᴛᴏ ᴏᴘᴇɴ</italic>"
      when-locked:
        material: "BARRIER"
        name: "<!italic><red><bold>📦 ɪᴛᴇᴍs ʟᴏᴄᴋᴇᴅ</bold></red>"
        lore:
          - "<!italic><gray>┌────────────────────┐"
          - "<!italic><gray>  ɪɴ ᴀɴɪᴍᴀʟs-ᴏɴʟʏ ᴍᴏᴅᴇ"
          - "<!italic><gray>  ɴᴏ ɪᴛᴇᴍs ᴀʟʟᴏᴡᴇᴅ"
          - "<!italic><gray>└────────────────────┘"
          - "<!italic><red>⬥ <italic>ɴᴏᴛ ᴀᴠᴀɪʟᴀʙʟᴇ</italic>"
    launch:
      position: 15
      material: "NETHER_STAR"
      name: "<!italic><yellow><bold>✈ ʟᴀᴜɴᴄʜ ᴅʀᴏɴᴇ</bold></yellow>"
      lore:
        - "<!italic><gray>┌────────────────────┐"
        - "<!italic><gray>  sᴇɴᴅs ᴛʜᴇ"
        - "<!italic><gray>  ᴅʀᴏɴᴇ ᴏғғ"
        - "<!italic><gray>└────────────────────┘"
        - "<!italic><yellow>⬥ <italic>ᴄʟɪᴄᴋ ᴛᴏ sᴇɴᴅ</italic>"
    send-animals:
      position: 13
      material: "LEAD"
      name: "<!italic><gold><bold>🐾 ᴀɴɪᴍᴀʟs ᴏɴʟʏ</bold></gold>"
      lore:
        - "<!italic><gray>┌────────────────────┐"
        - "<!italic><gray>  ᴛᴏɢɢʟᴇ:"
        - "<!italic><gray>  sᴇɴᴅ ᴀɴɪᴍᴀʟs"
        - "<!italic><gray>  (ɴᴏ ɪᴛᴇᴍs)"
        - "<!italic><gray>└────────────────────┘"
        - "<!italic><gold>⬥ <italic>ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ</italic>"
      when-active:
        enchanted: true
        name: "<!italic><aqua><bold>🐾 ᴀɴɪᴍᴀʟs (<count>) ✓</bold></aqua>"
        lore:
          - "<!italic><gray>┌────────────────────┐"
          - "<!italic><aqua>  ᴀᴄᴛɪᴠᴇ – ᴀɴɪᴍᴀʟs ᴏɴʟʏ"
          - "<!italic><gray>  ɴᴏ ɪᴛᴇᴍs ᴀʟʟᴏᴡᴇᴅ"
          - "<!italic><gray>└────────────────────┘"
          - "<!italic><aqua>⬥ <italic>ᴄʟɪᴄᴋ ᴛᴏ ᴅɪsᴀʙʟᴇ</italic>"

