        - "<!italic><gray>  ɪɴᴠᴇɴᴛᴏʀʏ ғᴏʀ sᴇɴᴅɪɴɢ."
        - "<!italic><gray>└────────────────────┘"
        - "<!italic><green>⬥ <italic>ᴄʟɪᴄᴋ ᴛᴏ sᴇʟᴇᴄᴛ</italic>"

