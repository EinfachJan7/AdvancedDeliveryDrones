  size: 54
  fill-item:
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
  back-item:
    position: 45
    material: "ARROW"
    name: "<!italic><gradient:#ffe066:#f0a500>⟵ ᴢᴜʀüᴄᴋ</gradient>"
