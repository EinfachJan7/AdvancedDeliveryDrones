# =============================================================================
# ADVANCED DELIVERY DRONES - GUI CONFIGURATION
# =============================================================================
# This file contains all GUI configurations for the drone plugin.
# You can customize titles, sizes, items, positions, names, and lore for all GUIs.
# Use <player> as a placeholder for player names in player head items.
# Use MiniMessage formatting for colors and styles (e.g., <red>, <bold>, <italic>)

# =============================================================================
# SEND MODE GUI - Choose between sending animals or items
# =============================================================================
send-mode:
  title: "<!italic><#3a3a3a>✦ <gradient:#f0a500:#ffe066>sᴇɴᴅᴇ-ᴍᴏᴅᴜs</gradient> <#3a3a3a>✦"
  size: 27
  fill-item:
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
  items:
    animals:
      position: 11
      material: "LEAD"
      name: "<!italic><gradient:#f0a500:#ffe066><bold>🐾 ᴛɪᴇʀᴇ sᴇɴᴅᴇɴ</bold></gradient>"
      lore:
        - "<!italic><#3a3a3a>┌────────────────────┐"
        - "<!italic><#aaaaaa>  sᴇɴᴅᴇᴛ ᴀʟʟᴇ ᴀɴɢᴇʟᴇɪɴᴛᴇ"
        - "<!italic><#aaaaaa>  ᴛɪᴇʀᴇ ᴢᴜ ᴇɪɴᴇᴍ sᴘɪᴇʟᴇʀ."
        - "<!italic><#3a3a3a>└────────────────────┘"
        - "<!italic><#f0a500>⬥ <italic>ᴋʟɪᴄᴋᴇɴ ᴢᴜᴍ ᴀᴜsᴡäʜʟᴇɴ</italic>"
    items:
      position: 15
      material: "CHEST"
      name: "<!italic><gradient:#00c9ff:#0057ff><bold>📦 ɪᴛᴇᴍs sᴇɴᴅᴇɴ</bold></gradient>"
      lore:
        - "<!italic><#3a3a3a>┌────────────────────┐"
        - "<!italic><#aaaaaa>  öꜰꜰɴᴇᴛ ᴅᴀs ᴘᴀᴋᴇᴛ-ɪɴᴠᴇɴᴛᴀʀ"
        - "<!italic><#aaaaaa>  ꜰüʀ ɪɴᴅɪᴠɪᴅᴜᴇʟʟᴇ sᴇɴᴅᴜɴɢᴇɴ."
        - "<!italic><#3a3a3a>└────────────────────┘"
        - "<!italic><#00c9ff>⬥ <italic>ᴋʟɪᴄᴋᴇɴ ᴢᴜᴍ ᴀᴜsᴡäʜʟᴇɴ</italic>"

# =============================================================================
# MAIN MENU GUI - Main drone menu with all options
# =============================================================================
main-menu:
  title: "<!italic><gradient:#00c9ff:#0057ff:#00c9ff>ᴅʀᴏʜɴᴇɴ-ᴍᴇɴü</gradient>"
  size: 27
  fill-item:
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
  items:
    send:
      position: 11
      material: "PLAYER_HEAD"
      name: "<!italic><gradient:#29e06a:#00a844><bold>✈ ᴅʀᴏʜɴᴇ sᴇɴᴅᴇɴ</bold></gradient>"
      lore:
        - "<!italic><#3a3a3a>┌────────────────────┐"
        - "<!italic><#aaaaaa>  ᴡäʜʟᴇ ᴇɪɴᴇɴ sᴘɪᴇʟᴇʀ ᴀᴜs,"
        - "<!italic><#aaaaaa>  ᴅᴇᴍ ᴅᴜ ᴇɪɴᴇ ᴅʀᴏʜɴᴇ sᴄʜɪᴄᴋsᴛ."
        - "<!italic><#3a3a3a>└────────────────────┘"
        - "<!italic><#29e06a>⬥ <italic>ᴋʟɪᴄᴋᴇɴ ᴢᴜᴍ sᴇɴᴅᴇɴ</italic>"
    toggle:
      position: 13
      material: "REDSTONE"
      name: "<!italic><gradient:#ffe066:#f0a500><bold>🔔 ᴇᴍᴘꜰᴀɴɢ ᴜᴍsᴄʜᴀʟᴛᴇɴ</bold></gradient>"
      lore:
        - "<!italic><#3a3a3a>┌────────────────────┐"
        - "<!italic><#aaaaaa>  ᴀᴋᴛɪᴠɪᴇʀᴇ ᴏᴅᴇʀ ᴅᴇᴀᴋᴛɪᴠɪᴇʀᴇ"
        - "<!italic><#aaaaaa>  ᴅᴇɴ ᴅʀᴏʜɴᴇɴ-ᴇᴍᴘꜰᴀɴɢ ꜰüʀ ᴅɪᴄʜ."
        - "<!italic><#3a3a3a>└────────────────────┘"
        - "<!italic><#ffe066>⬥ <italic>ᴋʟɪᴄᴋᴇɴ ᴢᴜᴍ ᴜᴍsᴄʜᴀʟᴛᴇɴ</italic>"
    decline:
      position: 15
      material: "BARRIER"
      name: "<!italic><gradient:#ff4f4f:#a80000><bold>✖ ᴅʀᴏʜɴᴇɴ ᴀʙʟᴇʜɴᴇɴ</bold></gradient>"
      lore:
        - "<!italic><#3a3a3a>┌────────────────────┐"
        - "<!italic><#aaaaaa>  ʟᴇʜɴᴛ ᴀʟʟᴇ ᴇɪɴɢᴇʜᴇɴᴅᴇɴ"
        - "<!italic><#aaaaaa>  ᴅʀᴏʜɴᴇɴ sᴏꜰᴏʀᴛ ᴀʙ."
        - "<!italic><#3a3a3a>└────────────────────┘"
        - "<!italic><#ff4f4f>⬥ <italic>ᴋʟɪᴄᴋᴇɴ ᴢᴜᴍ ᴀʙʟᴇʜɴᴇɴ</italic>"
    preview:
      position: 22
      material: "ENDER_EYE"
      name: "<!italic><gradient:#00c9ff:#0057ff><bold>👁 ᴅʀᴏʜɴᴇɴ-ᴠᴏʀsᴄʜᴀᴜ</bold></gradient>"
      lore:
        - "<!italic><#3a3a3a>┌────────────────────┐"
        - "<!italic><#aaaaaa>  ᴢᴇɪɢᴇ ᴇɪɴᴇ üʙᴇʀsɪᴄʜᴛ"
        - "<!italic><#aaaaaa>  ᴅᴇɪɴᴇʀ ᴀᴋᴛɪᴠᴇɴ ᴅʀᴏʜɴᴇɴ."
        - "<!italic><#3a3a3a>└────────────────────┘"
        - "<!italic><#00c9ff>⬥ <italic>ᴋʟɪᴄᴋᴇɴ ᴢᴜʀ ᴠᴏʀsᴄʜᴀᴜ</italic>"

# =============================================================================
# PLAYER SELECTION GUI - Select a player to send a drone to
