name: AdvancedDeliveryDrones
main: de.cb.drones.AdvancedDeliveryDronesPlugin
version: 1.0.0
api-version: "1.21"
authors: [CB]
commands:
  drone:
    description: Main command for delivery drones
    usage: /drone <send|admin|preview|toggle|reload|list|decline|socket>
permissions:
  drone.send:
    default: true
  drone.use:
    default: true
  drone.admin:
    default: op
  drone.socket:
    default: true
