settings:
  drone:
    speed: 5.0
    startup-speed: 0.2
    startup-seconds: 3
    skull-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzM1YWEzZTJiZjE4NTQ0Zjc1ZTZlMTViMDI2Zjc0N2I1OTllMThmOTZhOWVjNTQ1N2JkNTFhZDhkZjA0YTE2YiJ9fX0="
    delivery-radius: 10.0
    despawn-time-minutes: 10
    despawn-mode: "DELETE"
    max-active-per-sender: 3
    carry-leashed-animals: true
    max-leashed-animals-per-drone: 5
    send-mode-gui:
      title: "<!italic>Sende-Modus"
      animals-item:
        material: "LEAD"
        name: "<!italic><gold>Tiere senden</gold>"
        lore:
          - "<!italic><gray>Sendet nur angeleinte Tiere.</gray>"
      items-item:
        material: "CHEST"
        name: "<!italic><gold>Items senden</gold>"
        lore:
          - "<!italic><gray>Öffnet das Paket-Inventar.</gray>"
    main-menu:
      title: "<!italic>Drone Menü"
      size: 27
      items:
        send:
          position: 11
          material: "PLAYER_HEAD"
          name: "<!italic><green>Drohne senden</green>"
          lore:
            - "<!italic><gray>Wähle einen Spieler aus"
            - "<!italic><gray>um ihm eine Drohne zu senden"
        toggle:
          position: 13
          material: "REDSTONE"
          name: "<!italic><yellow>Drohnen-Empfang umschalten</yellow>"
          lore:
            - "<!italic><gray>Schalte ein/aus ob du"
            - "<!italic><gray>Drohnen empfangen möchtest"
        decline:
          position: 15
          material: "BARRIER"
          name: "<!italic><red>Eingehende Drohnen ablehnen</red>"
          lore:
            - "<!italic><gray>Lehne alle eingehenden"
            - "<!italic><gray>Drohnen für dich ab"
        preview:
          position: 22
          material: "ENDER_EYE"
          name: "<!italic><aqua>Drohne-Vorschau</aqua>"
          lore:
            - "<!italic><gray>Zeige eine Vorschau deiner"
            - "<!italic><gray>aktiven Drohnen"
      fill-item:
        material: "GRAY_STAINED_GLASS_PANE"
        name: " "
    player-selection:
      title: "<!italic>Spieler auswählen"
      size: 54
      fill-item:
        material: "GRAY_STAINED_GLASS_PANE"
        name: " "
      back-item:
        position: 45
        material: "ARROW"
        name: "<!italic><yellow>Zurück</yellow>"
        lore:
          - "<!italic><gray>Zurück zum Hauptmenü"
    target-selection:
      title: "<!italic>Ziel auswählen"
      size: 27
      fill-item:
        material: "GRAY_STAINED_GLASS_PANE"
        name: " "
      back-item:
        position: 26
        material: "ARROW"
        name: "<!italic><yellow>Zurück</yellow>"
        lore:
          - "<!italic><gray>Zurück zum Hauptmenü"
      items:
        player:
          position: 11
          material: "PLAYER_HEAD"
          name: "<!italic><green>Spieler auswählen</green>"
          lore:
            - "<!italic><gray>Wähle einen Spieler aus"
            - "<!italic><gray>um ihm eine Drohne zu senden"
        socket:
          position: 15
          material: "BEACON"
          name: "<!italic><yellow>Socket auswählen</yellow>"
          lore:
            - "<!italic><gray>Wähle einen Socket aus"
            - "<!italic><gray>um dort eine Drohne zu senden"
    socket-selection:
      title: "<!italic>Socket auswählen"
      size: 54
      fill-item:
        material: "GRAY_STAINED_GLASS_PANE"
        name: " "
      back-item:
        position: 45
        material: "ARROW"
        name: "<!italic><yellow>Zurück</yellow>"
        lore:
          - "<!italic><gray>Zurück zur Zielauswahl"
    socket-item-format:
      name-format: "<!italic><white><name></white>"
      owner-format: "<!italic><gray>Besitzer: <white><owner></white></gray>"
      click-hint: "<!italic><green>Klicke um Drohne zu senden</green>"
      empty-line: "<!italic><gray></gray>"
    blocked-worlds:
      - "world_nether"
      - "world_the_end"
    particle-types:
      - "ELECTRIC_SPARK"
      # Example RGB dust particle (red, size 1.0):
      # - "DUST:255,0,0:1.0"
    particle-count: 4
    particle-trail-length: 10
    particle-y-offset: 1.0
    flight-sound: "entity.elytra.flying"
    inventory-size: 54
    hologram:
      enabled: true
      offset-y: 1.0
      format: "<yellow>Paket fuer <white><receiver></white> <gray>(Despawn: <minutes>m <seconds>s)</gray>"
    bossbar:
      enabled: true
      format: "<gold>Distanz zur Drone: <white><distance>m</white> <gray>| ETA: <white><eta>s</white></gray>"
    collection-animation:
      enabled: true

discord:
  enabled: true
  webhook-url: ""
  username: "Delivery Drone"
  avatar-url: ""
  embed:
    enabled: true
    color: "#00ff00"
    thumbnail:
      enabled: true
      url: ""
    image:
      enabled: false
      url: ""
    footer:
      text: "Advanced Delivery Drones"
      icon-url: ""
  include-items: true
  include-animals: true
  max-items-display: 10
  max-animals-display: 5

